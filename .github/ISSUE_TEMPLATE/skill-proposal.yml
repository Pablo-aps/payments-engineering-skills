name: Skill proposal
description: Propose a bounded payment-engineering skill or a material expansion.
title: "[Skill]: "
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: Engineering task
      description: What concrete task should the skill help an agent complete?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger boundary
      description: When should and should not the skill activate?
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Critical failure modes
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary references
    validations:
      required: true
