<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">Happy-path payment review compared with payment-aware review</title>
  <desc id="description">A comparison showing that payment-aware review treats a timeout as indeterminate, deduplicates the financial effect rather than only the webhook event, and requires item-level reconciliation rather than matching totals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0c2635"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.7px; }
      .label { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.7px; }
      .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 400; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect width="960" height="520" rx="28" fill="url(#background)"/>
  <text x="480" y="39" text-anchor="middle" class="eyebrow" fill="#94a3b8">SAME PAYMENT CODE. DIFFERENT QUESTIONS.</text>

  <g filter="url(#shadow)">
    <rect x="24" y="62" width="430" height="380" rx="22" fill="#111c2c" stroke="#4c2636"/>
    <rect x="506" y="62" width="430" height="380" rx="22" fill="#111c2c" stroke="#155e63"/>
  </g>

  <circle cx="480" cy="252" r="23" fill="#e2e8f0"/>
  <path d="M471 252h18m-7-7 7 7-7 7" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="48" y="91" class="panel-title" fill="#fda4af">HAPPY-PATH REVIEW</text>
  <text x="530" y="91" class="panel-title" fill="#5eead4">PAYMENT-AWARE REVIEW</text>

  <g>
    <rect x="42" y="108" width="394" height="92" rx="14" fill="#211624" stroke="#4c2636"/>
    <text x="62" y="135" class="label" fill="#fb7185">REFUND TIMEOUT</text>
    <text x="62" y="166" class="value" fill="#f8fafc">Retry the request</text>
    <text x="62" y="188" class="detail" fill="#94a3b8">A missing response looks like failure.</text>

    <rect x="524" y="108" width="394" height="92" rx="14" fill="#0b292c" stroke="#155e63"/>
    <text x="544" y="135" class="label" fill="#2dd4bf">INDETERMINATE</text>
    <text x="544" y="166" class="value" fill="#f8fafc">Recover before retrying</text>
    <text x="544" y="188" class="detail" fill="#a7f3d0">The provider may have accepted it.</text>
  </g>

  <g>
    <rect x="42" y="216" width="394" height="92" rx="14" fill="#211624" stroke="#4c2636"/>
    <text x="62" y="243" class="label" fill="#fb7185">DUPLICATE WEBHOOK</text>
    <text x="62" y="274" class="value" fill="#f8fafc">Dedupe the event ID</text>
    <text x="62" y="296" class="detail" fill="#94a3b8">A second ID can carry the same fact.</text>

    <rect x="524" y="216" width="394" height="92" rx="14" fill="#0b292c" stroke="#155e63"/>
    <text x="544" y="243" class="label" fill="#2dd4bf">FINANCIAL EFFECT</text>
    <text x="544" y="274" class="value" fill="#f8fafc">Dedupe what moves money</text>
    <text x="544" y="296" class="detail" fill="#a7f3d0">Delivery and business identity differ.</text>
  </g>

  <g>
    <rect x="42" y="324" width="394" height="92" rx="14" fill="#211624" stroke="#4c2636"/>
    <text x="62" y="351" class="label" fill="#fb7185">RECONCILIATION</text>
    <text x="62" y="382" class="value" fill="#f8fafc">Difference = 0 ✓</text>
    <text x="62" y="404" class="detail" fill="#94a3b8">Offsetting omissions remain invisible.</text>

    <rect x="524" y="324" width="394" height="92" rx="14" fill="#0b292c" stroke="#155e63"/>
    <text x="544" y="351" class="label" fill="#2dd4bf">ITEM-LEVEL MATCHING</text>
    <text x="544" y="382" class="value" fill="#f8fafc">Explain every residual</text>
    <text x="544" y="404" class="detail" fill="#a7f3d0">Prove completeness in both directions.</text>
  </g>

  <rect x="24" y="460" width="912" height="38" rx="12" fill="#e2e8f0"/>
  <text x="480" y="485" text-anchor="middle" class="footer" fill="#0f172a">Stronger failure models → safer decisions → recoverable outcomes</text>
</svg>
